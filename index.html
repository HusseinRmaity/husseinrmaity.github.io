<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Log — n8n practice, 18 months</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F1E8;
    --surface: #FFFFFF;
    --surface-2: #EDE7D9;
    --ink-1: #1A1815;
    --ink-2: #57534E;
    --ink-3: #9C948A;
    --accent: #2B3A67;
    --accent-ink: #FFFFFF;
    --accent-soft: #DEE4F0;
    --success: #3F6B4E;
    --success-soft: #E1EBE3;
    --warning: #A66534;
    --warning-soft: #F0E3D3;
    --rule: #DDD5C4;
    --rule-strong: #C4BBA8;

    --serif: 'IBM Plex Serif', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink-1);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, textarea { font-family: inherit; font-size: inherit; }

  /* Layout ------------------------------------------------------------ */

  .shell {
    max-width: 1240px;
    margin: 0 auto;
    padding: 32px 40px 80px;
  }

  @media (max-width: 720px) {
    .shell { padding: 20px 16px 60px; }
  }

  /* Masthead ---------------------------------------------------------- */

  .masthead {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--rule-strong);
    margin-bottom: 32px;
    gap: 24px;
  }

  .masthead-title {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--ink-1);
  }

  .masthead-sub {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: var(--ink-2);
    margin-top: 6px;
  }

  .masthead-meta {
    display: flex;
    gap: 20px;
    align-items: end;
    text-align: right;
  }

  .meta-block { text-align: right; }
  .meta-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 4px;
    display: block;
  }
  .meta-value {
    font-family: var(--mono);
    font-size: 18px;
    color: var(--ink-1);
    font-weight: 500;
  }
  .meta-value.accent { color: var(--accent); }

  @media (max-width: 720px) {
    .masthead { grid-template-columns: 1fr; gap: 16px; }
    .masthead-meta { justify-content: flex-start; text-align: left; }
    .meta-block { text-align: left; }
    .masthead-title { font-size: 24px; }
  }

  /* Workspace grid ---------------------------------------------------- */

  .workspace {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 32px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .workspace { grid-template-columns: 1fr; }
  }

  /* Journey stratigraphy --------------------------------------------- */

  .journey {
    position: sticky;
    top: 20px;
  }

  .journey-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--rule);
  }

  .journey-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-2);
  }

  .journey-progress {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-3);
  }

  .strata {
    display: flex;
    flex-direction: column;
  }

  .stratum {
    display: grid;
    grid-template-columns: 40px 1fr;
    align-items: stretch;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    transition: background-color 0.15s ease;
    position: relative;
    background: transparent;
    width: 100%;
    text-align: left;
  }

  .stratum:hover {
    background: rgba(43, 58, 103, 0.04);
  }

  .stratum::before {
    content: "";
    position: absolute;
    left: -8px;
    top: 0;
    bottom: 0;
    width: 3px;
    background: transparent;
    transition: background 0.2s ease;
  }

  .stratum.current::before { background: var(--accent); }

  .stratum-index {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-3);
    padding-top: 2px;
    letter-spacing: 0.08em;
  }

  .stratum.current .stratum-index { color: var(--accent); }
  .stratum.complete .stratum-index { color: var(--success); }

  .stratum-body { min-width: 0; }

  .stratum-name {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 500;
    color: var(--ink-1);
    line-height: 1.2;
    margin-bottom: 3px;
  }

  .stratum.upcoming .stratum-name { color: var(--ink-3); }

  .stratum-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .stratum-duration {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-2);
    letter-spacing: 0.02em;
  }

  .stratum-count {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  .stratum.complete .stratum-count { color: var(--success); }

  .stratum-fill {
    height: 2px;
    background: var(--rule);
    margin-top: 8px;
    overflow: hidden;
    border-radius: 1px;
  }

  .stratum-fill-bar {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
  }

  .stratum.complete .stratum-fill-bar { background: var(--success); }
  .stratum.upcoming .stratum-fill-bar { background: var(--ink-3); }

  /* Journey mobile toggle */
  @media (max-width: 900px) {
    .journey { position: static; margin-bottom: 8px; }
  }

  /* Content sections -------------------------------------------------- */

  .content { display: flex; flex-direction: column; gap: 40px; min-width: 0; }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
    gap: 16px;
  }

  .section-eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 6px;
  }

  .section-title {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink-1);
    line-height: 1.15;
  }

  .section-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-2);
    text-align: right;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Phase panel ------------------------------------------------------- */

  .phase-summary {
    font-family: var(--serif);
    font-size: 16px;
    font-style: italic;
    color: var(--ink-2);
    margin-bottom: 24px;
    line-height: 1.5;
    max-width: 640px;
  }

  .task-list { display: flex; flex-direction: column; }

  .task {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: start;
    padding: 12px 0;
    border-bottom: 1px solid var(--rule);
    gap: 8px;
    cursor: pointer;
    transition: background-color 0.12s ease;
  }

  .task:hover { background: rgba(0,0,0,0.015); }

  .task-check {
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--rule-strong);
    border-radius: 3px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }

  .task.done .task-check {
    background: var(--success);
    border-color: var(--success);
  }

  .task-check svg { opacity: 0; }
  .task.done .task-check svg { opacity: 1; }

  .task-text {
    font-size: 14.5px;
    color: var(--ink-1);
    line-height: 1.5;
    padding-right: 8px;
  }

  .task.done .task-text {
    color: var(--ink-3);
    text-decoration: line-through;
    text-decoration-color: var(--ink-3);
  }

  .task-tag {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 3px 6px;
    background: var(--surface-2);
    border-radius: 2px;
    align-self: center;
    white-space: nowrap;
  }

  /* Gate panel -------------------------------------------------------- */

  .gate {
    margin-top: 32px;
    padding: 20px 22px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    border-radius: 0 4px 4px 0;
  }

  .gate.passed { border-left-color: var(--success); background: var(--success-soft); }

  .gate-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .gate.passed .gate-label { color: var(--success); }

  .gate-title {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 17px;
    color: var(--ink-1);
    margin-bottom: 12px;
  }

  .gate-criteria { display: flex; flex-direction: column; gap: 8px; }

  .gate-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 14px;
    color: var(--ink-1);
  }

  .gate-item-marker {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    flex-shrink: 0;
    min-width: 20px;
  }

  .gate-item.hit .gate-item-marker { color: var(--success); }

  /* Metrics grid ------------------------------------------------------ */

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }

  .metric {
    background: var(--surface);
    padding: 16px 18px;
  }

  .metric-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 8px;
  }

  .metric-value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 500;
    color: var(--ink-1);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .metric-value.accent { color: var(--accent); }
  .metric-value.success { color: var(--success); }

  .metric-unit {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-3);
    font-weight: 400;
    margin-left: 3px;
  }

  /* Log panel --------------------------------------------------------- */

  .log-form {
    background: var(--surface);
    border: 1px solid var(--rule);
    padding: 20px 22px;
    margin-bottom: 24px;
  }

  .log-form-toggle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0;
    color: var(--ink-1);
    font-size: 14px;
  }

  .log-form-toggle-label {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 15px;
  }

  .log-form-toggle-icon {
    font-family: var(--mono);
    color: var(--ink-3);
    font-size: 16px;
    transition: transform 0.2s ease;
  }

  .log-form.open .log-form-toggle-icon { transform: rotate(45deg); }

  .log-form-body { display: none; margin-top: 18px; }
  .log-form.open .log-form-body { display: block; }

  .log-fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }

  .field-group { display: flex; flex-direction: column; }

  .field-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 5px;
  }

  .field-input {
    background: var(--bg);
    border: 1px solid var(--rule);
    padding: 8px 10px;
    color: var(--ink-1);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
    border-radius: 2px;
  }

  .field-input:focus { border-color: var(--accent); }

  textarea.field-input {
    font-family: var(--sans);
    font-size: 13px;
    resize: vertical;
    min-height: 60px;
  }

  .log-form-body .field-group.full-width { grid-column: 1 / -1; }

  .log-form-body .field-group.full-width textarea { min-height: 72px; }

  .log-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 12px;
  }

  .btn {
    padding: 8px 16px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 2px;
    transition: all 0.15s;
    border: 1px solid var(--rule-strong);
    background: var(--surface);
    color: var(--ink-1);
  }
  .btn:hover { border-color: var(--ink-2); }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .btn-primary:hover { background: #1e2a4d; border-color: #1e2a4d; }

  .btn-danger { color: var(--warning); border-color: transparent; padding: 4px 8px; font-size: 10px; }
  .btn-danger:hover { color: #7a4020; }

  /* Log list ---------------------------------------------------------- */

  .log-entries { display: flex; flex-direction: column; }

  .log-entry {
    display: grid;
    grid-template-columns: 100px 1fr auto;
    gap: 20px;
    padding: 16px 0;
    border-bottom: 1px solid var(--rule);
    align-items: start;
  }

  .log-week {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-2);
    padding-top: 2px;
    line-height: 1.5;
  }

  .log-week-strong {
    color: var(--ink-1);
    display: block;
    font-weight: 500;
    margin-bottom: 2px;
  }

  .log-numbers {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 22px;
    font-size: 13px;
    align-items: baseline;
  }

  .log-num-item { display: flex; align-items: baseline; gap: 4px; }
  .log-num-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .log-num-value {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--ink-1);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .log-note {
    grid-column: 2;
    font-family: var(--serif);
    font-style: italic;
    font-size: 13.5px;
    color: var(--ink-2);
    margin-top: 8px;
    line-height: 1.5;
  }

  .empty-state {
    padding: 32px 20px;
    text-align: center;
    color: var(--ink-3);
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    border: 1px dashed var(--rule-strong);
    border-radius: 3px;
  }

  /* Notes panel ------------------------------------------------------- */

  .notes-textarea {
    width: 100%;
    min-height: 160px;
    background: var(--surface);
    border: 1px solid var(--rule);
    padding: 16px 18px;
    color: var(--ink-1);
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.6;
    outline: none;
    resize: vertical;
    transition: border-color 0.15s;
    border-radius: 2px;
  }
  .notes-textarea:focus { border-color: var(--accent); }

  .save-indicator {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .save-indicator.saving { color: var(--accent); }

  /* Positioning card -------------------------------------------------- */

  .positioning {
    background: var(--surface-2);
    padding: 20px 24px;
    border-radius: 3px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }

  .positioning-field { display: flex; flex-direction: column; }

  .positioning-field label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 6px;
  }

  .positioning-field input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule-strong);
    padding: 4px 0 8px;
    color: var(--ink-1);
    font-family: var(--serif);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  .positioning-field input:focus { border-bottom-color: var(--accent); }
  .positioning-field input::placeholder {
    color: var(--ink-3);
    font-style: italic;
  }

  /* Endgame panel ----------------------------------------------------- */

  .endgame {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 24px;
  }

  .endgame-card {
    background: var(--surface);
    border: 1px solid var(--rule);
    padding: 18px 20px;
    border-radius: 3px;
  }

  .endgame-name {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 16px;
    margin-bottom: 6px;
  }
  .endgame-ceiling {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .endgame-desc {
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.5;
  }

  /* Footer note ------------------------------------------------------- */

  .footer-note {
    margin-top: 60px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.5;
    max-width: 640px;
  }

  /* Reset link ------------------------------------------------------- */

  .reset-link {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-3);
    text-decoration: underline;
    text-decoration-color: var(--rule-strong);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    margin-top: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .reset-link:hover { color: var(--warning); }

  /* Loading state ----------------------------------------------------- */

  .loading {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-3);
    font-family: var(--serif);
    font-style: italic;
  }

</style>
</head>
<body>

<div class="shell" id="app">
  <div class="loading">Loading field log…</div>
</div>

// ============================================================================
// STATE
// ============================================================================

const STORAGE_KEY = "freelance_journey_v1";

const DEFAULT_STATE = {
  version: 1,
  startDate: null,
  currentPhase: 0,
  tasks: {},
  logs: [],
  notes: "",
  positioning: { who: "", what: "", outcome: "" }
};

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let saveTimeout = null;

async function loadState() {
  try {
    const result = await window.storage.get(STORAGE_KEY);
    if (result && result.value) {
      const loaded = JSON.parse(result.value);
      Object.assign(state, loaded);
    }
  } catch (e) {
    // First run, storage doesn't have it yet — that's fine
  }
  if (!state.startDate) {
    state.startDate = new Date().toISOString().split("T")[0];
    await persist();
  }
}

async function persist() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(state));
    setSaveIndicator("saved");
  } catch (e) {
    setSaveIndicator("error");
    console.error("Save failed:", e);
  }
}

function save() {
  setSaveIndicator("saving");
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(persist, 400);
}

function setSaveIndicator(state_str) {
  const el = document.getElementById("save-indicator");
  if (!el) return;
  if (state_str === "saving") {
    el.textContent = "Saving…";
    el.classList.add("saving");
  } else if (state_str === "saved") {
    el.textContent = "Saved";
    el.classList.remove("saving");
  } else {
    el.textContent = "Save error";
    el.classList.remove("saving");
  }
}

// ============================================================================
// DERIVED VALUES
// ============================================================================

function daysSinceStart() {
  if (!state.startDate) return 0;
  const start = new Date(state.startDate);
  const now = new Date();
  return Math.floor((now - start) / (1000 * 60 * 60 * 24));
}

function phaseProgress(phaseIndex) {
  const phase = PHASES[phaseIndex];
  const done = phase.tasks.filter(t => state.tasks[t.id]).length;
  return { done, total: phase.tasks.length, percent: phase.tasks.length ? Math.round(done / phase.tasks.length * 100) : 0 };
}

function phaseComplete(phaseIndex) {
  const p = phaseProgress(phaseIndex);
  return p.total > 0 && p.done === p.total;
}

function totalTasksDone() {
  return PHASES.reduce((sum, p) => sum + p.tasks.filter(t => state.tasks[t.id]).length, 0);
}

function totalTasks() {
  return PHASES.reduce((sum, p) => sum + p.tasks.length, 0);
}

function metrics() {
  const logs = state.logs || [];
  const totalRevenue = logs.reduce((s, l) => s + (Number(l.revenue) || 0), 0);
  const totalProposals = logs.reduce((s, l) => s + (Number(l.proposals) || 0), 0);
  const totalDms = logs.reduce((s, l) => s + (Number(l.dms) || 0), 0);
  const totalProjects = logs.reduce((s, l) => s + (Number(l.projects) || 0), 0);
  const totalReviews = logs.reduce((s, l) => s + (Number(l.reviews) || 0), 0);
  const activeRetainers = logs.length > 0 ? (Number(logs[0].retainers) || 0) : 0;

  // last 4 weeks
  const recent = logs.slice(0, 4);
  const recentRevenue = recent.reduce((s, l) => s + (Number(l.revenue) || 0), 0);
  const recentProposals = recent.reduce((s, l) => s + (Number(l.proposals) || 0), 0);

  return {
    totalRevenue, totalProposals, totalDms, totalProjects, totalReviews, activeRetainers,
    recentRevenue, recentProposals,
    logCount: logs.length
  };
}

function formatCurrency(n) {
  if (!n && n !== 0) return "$0";
  return "$" + Math.round(n).toLocaleString();
}

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

  window.scrollTo({ top: 0, behavior: "smooth" });
};

window.toggleTask = function(taskId) {
  state.tasks[taskId] = !state.tasks[taskId];
  save();
  render();
};

window.toggleLogForm = function() {
  const form = document.getElementById("log-form");
  if (form) form.classList.toggle("open");
};

window.submitLog = function() {
  const entry = {
    id: Date.now(),
    weekStart: document.getElementById("lf-week").value || new Date().toISOString().split("T")[0],
    proposals: Number(document.getElementById("lf-proposals").value) || 0,
    dms: Number(document.getElementById("lf-dms").value) || 0,
    conversations: Number(document.getElementById("lf-conversations").value) || 0,
    projects: Number(document.getElementById("lf-projects").value) || 0,
    revenue: Number(document.getElementById("lf-revenue").value) || 0,
    reviews: Number(document.getElementById("lf-reviews").value) || 0,
    retainers: Number(document.getElementById("lf-retainers").value) || 0,
    notes: document.getElementById("lf-notes").value || ""
  };
  state.logs.unshift(entry);
  save();
  render();
};

window.deleteLog = function(id) {
  if (!confirm("Delete this entry?")) return;
  state.logs = state.logs.filter(l => l.id !== id);
  save();
  render();
};

let notesDebounce = null;
window.updateNotes = function(value) {
  state.notes = value;
  clearTimeout(notesDebounce);
  notesDebounce = setTimeout(save, 500);
};

let posDebounce = null;
window.updatePositioning = function(field, value) {
  state.positioning[field] = value;
  clearTimeout(posDebounce);
  posDebounce = setTimeout(save, 500);
};

window.confirmReset = async function() {
  if (!confirm("Reset all progress? This clears every checkbox, log entry, and note. It cannot be undone.")) return;
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  state.startDate = new Date().toISOString().split("T")[0];
  await persist();
  render();
};

// ============================================================================
// INIT
// ============================================================================

(async function init() {
  await loadState();
  render();
})();

</script>
</body>
</html>
